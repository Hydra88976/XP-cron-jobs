name: Delete All Workflow Runs

on:
  workflow_dispatch:  # Run manually from GitHub Actions tab
  

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Delete all workflow runs
        run: |
          echo "Fetching workflows..."
          workflows=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id')

          for wid in $workflows; do
            echo "Deleting runs for workflow ID: $wid"
            run_ids=$(gh api repos/${{ github.repository }}/actions/workflows/$wid/runs --jq '.workflow_runs[].id')

            for rid in $run_ids; do
              echo "Deleting run ID: $rid"
              gh api repos/${{ github.repository }}/actions/runs/$rid -X DELETE
            done
          done

          echo "✅ All workflow runs deleted."
